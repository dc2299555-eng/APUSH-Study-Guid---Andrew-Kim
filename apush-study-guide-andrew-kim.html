<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APUSH Study Guide — Andrew Kim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* deep spruce ground, chalk type, mint + rose signal colors */
  --bg:#0F1B19;
  --panel:#182A27;
  --panel-2:#22403A;
  --paper:#EDF2F0;
  --chalk:#E1EAE7;
  --chalk-dim:#8FA6A0;
  --rose:#E4657E;
  --mint:#3FC4A2;
  --sky:#86B7F0;
  --rule:rgba(225,234,231,.16);
  --sans:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  --display:'Bricolage Grotesque','Space Grotesk','IBM Plex Sans',sans-serif;
  --text:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  /* names used through the rest of the sheet */
  --indigo-900:var(--bg);
  --indigo-800:var(--panel);
  --indigo-700:var(--panel-2);
  --bone:var(--chalk);
  --bone-dim:var(--chalk-dim);
  --madder:var(--rose);
  --verdigris:var(--mint);
  --brass:var(--sky);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--indigo-900);
  color:var(--bone);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding:28px 20px 60px;
}
.wrap{max-width:820px;margin:0 auto}

/* ---------- masthead ---------- */
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--rule)}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em}
h1 span{display:block;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--bone-dim);
  letter-spacing:.02em;margin-top:6px}
.modes{display:flex;gap:2px;background:rgba(0,0,0,.22);border:1px solid var(--rule);border-radius:2px;padding:3px}
.modes button{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--bone-dim);background:none;
  border:0;padding:7px 14px;cursor:pointer;border-radius:1px}
.modes button[aria-pressed=true]{background:var(--bone);color:var(--indigo-900)}
.modes button:hover:not([aria-pressed=true]){color:var(--bone)}

/* ---------- unit timeline (content really is chronological) ---------- */
.units{display:flex;align-items:stretch;gap:0;margin:22px 0 6px;overflow-x:auto;padding-bottom:4px}
.units button{position:relative;flex:1 1 0;min-width:104px;background:none;border:0;cursor:pointer;
  padding:12px 8px 14px;text-align:left;color:var(--bone-dim);font-family:var(--sans);border-top:2px solid var(--rule)}
.units button b{display:block;font-family:var(--display);font-size:18px;font-weight:600;color:var(--bone-dim);line-height:1;letter-spacing:-.015em}
.units button i{display:block;font-style:normal;font-size:11.5px;line-height:1.35;margin-top:7px}
.units button[aria-pressed=true]{border-top-color:var(--madder)}
.units button[aria-pressed=true] b,.units button[aria-pressed=true] i{color:var(--bone)}
.units button:hover b,.units button:hover i{color:var(--bone)}

.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--bone-dim);margin:14px 0 18px}
.meta .tools{display:flex;gap:16px}
.meta button{background:none;border:0;color:var(--bone-dim);font-family:var(--sans);font-size:12.5px;
  cursor:pointer;padding:0;border-bottom:1px solid transparent}
.meta button:hover{color:var(--bone);border-bottom-color:var(--madder)}

/* ---------- flashcard ---------- */
.stage{perspective:1600px;margin:0 0 20px}
.card{position:relative;width:100%;min-height:330px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.1,.2,1);
  border:0;padding:0;background:none;font:inherit;color:inherit;display:block;text-align:left}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:3px;
  padding:34px 36px;display:flex;flex-direction:column}
.front{background:var(--paper);color:var(--bg)}
.back{background:var(--panel);color:var(--chalk);transform:rotateY(180deg);
  border:1px solid rgba(225,234,231,.26)}
.tag{font-size:11.5px;font-weight:500;letter-spacing:.03em;color:var(--indigo-700);opacity:.72}
.back .tag{color:var(--bone-dim);opacity:1}
.term{font-family:var(--display);font-weight:700;font-size:clamp(29px,5.2vw,44px);line-height:1.06;
  margin:auto 0;letter-spacing:-.03em}
.def{font-family:var(--text);font-size:17.5px;line-height:1.6;margin:auto 0;max-width:58ch}
.hint{font-size:11.5px;color:var(--indigo-700);opacity:.62;margin-top:auto}
.back .hint{color:var(--bone-dim);opacity:.75}
.star{position:absolute;top:26px;right:28px;background:none;border:0;cursor:pointer;font-size:19px;
  line-height:1;color:rgba(15,27,25,.3);padding:4px}
.back .star{color:rgba(225,234,231,.35)}
.star.on,.back .star.on{color:var(--sky)}

/* ---------- controls ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.nav button{font-family:var(--sans);font-size:13.5px;font-weight:500;background:none;color:var(--bone);
  border:1px solid var(--rule);border-radius:2px;padding:11px 18px;cursor:pointer}
.nav button:hover{border-color:var(--bone-dim)}
.sort{display:flex;gap:10px;flex:1}
.sort button{flex:1}
.sort .learn{border-color:rgba(228,101,126,.5)}
.sort .learn:hover{background:rgba(228,101,126,.14);border-color:var(--rose)}
.sort .known{border-color:rgba(63,196,162,.5)}
.sort .known:hover{background:rgba(63,196,162,.14);border-color:var(--mint)}

.bar{height:3px;background:rgba(225,234,231,.12);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--verdigris)}
.bar .l{background:var(--madder)}
.tally{display:flex;justify-content:space-between;font-size:12px;color:var(--bone-dim);margin-top:9px}
.tally b{font-weight:500;color:var(--bone)}

/* ---------- quiz ---------- */
.quiz .prompt{background:var(--paper);color:var(--bg);border-radius:3px;padding:30px 32px;
  font-family:var(--text);font-size:17.5px;line-height:1.6}
.quiz .prompt .tag{display:block;margin-bottom:14px}
.opts{display:grid;gap:9px;margin:16px 0}
.opts button{text-align:left;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.015em;color:var(--chalk);
  background:rgba(255,255,255,.035);border:1px solid var(--rule);border-radius:2px;padding:15px 18px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--bone-dim);background:rgba(255,255,255,.07)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--mint);background:rgba(63,196,162,.18)}
.opts button.wrong{border-color:var(--rose);background:rgba(228,101,126,.16)}
.verdict{font-family:var(--text);font-size:15.5px;line-height:1.6;min-height:26px;margin-bottom:14px}

/* ---------- list ---------- */
.list dl{margin:0}
.list .grp{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--madder);
  padding:26px 0 10px;border-bottom:1px solid var(--rule)}
.list dt{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.02em;margin:20px 0 5px}
.list dd{font-family:var(--text);font-size:16px;line-height:1.6;margin:0;color:#C4D3CF;max-width:72ch}
.list dd em{font-style:normal;color:var(--bone-dim);font-family:var(--sans);font-size:12px;
  display:block;margin-top:5px}

.empty{border:1px dashed var(--rule);border-radius:3px;padding:44px 32px;text-align:center;color:var(--chalk-dim);
  font-family:var(--text);font-size:16.5px;line-height:1.6}
.empty button{display:inline-block;margin-top:16px;font-family:var(--sans);font-size:13.5px;color:var(--bone);
  background:none;border:1px solid var(--rule);border-radius:2px;padding:10px 18px;cursor:pointer}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
@media (max-width:640px){
  body{padding:20px 14px 48px}
  .face{padding:26px 24px}
  .card{min-height:300px}
  .nav{flex-wrap:wrap}
  .nav>button{flex:1 1 40%}
  .sort{flex:1 1 100%;order:3}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>APUSH Study Guide<span>Andrew Kim &middot; <span id="total"></span> cards across six units, 1491–1877</span></h1>
  <div class="modes" role="group" aria-label="Study mode">
    <button id="m-cards" aria-pressed="true">Flashcards</button>
    <button id="m-quiz" aria-pressed="false">Quiz</button>
    <button id="m-list" aria-pressed="false">Browse</button>
  </div>
</header>

<nav class="units" id="units" aria-label="Filter by unit"></nav>

<div class="meta">
  <span id="position"></span>
  <div class="tools">
    <button id="shuffle">Shuffle</button>
    <button id="starred-only">Starred only</button>
    <button id="reset">Reset progress</button>
  </div>
</div>

<!-- FLASHCARDS -->
<section id="view-cards">
  <div class="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="face front">
        <span class="tag" id="f-tag"></span>
        <span class="term" id="f-term"></span>
        <span class="hint">Click, or press space, to see the definition</span>
      </div>
      <div class="face back">
        <span class="tag" id="b-tag"></span>
        <span class="def" id="b-def"></span>
        <span class="hint">Click to flip back</span>
      </div>
    </button>
    <button class="star" id="star" title="Star this card" aria-label="Star this card">★</button>
  </div>
  <div class="nav">
    <button id="prev">← Back</button>
    <div class="sort">
      <button class="learn" id="learn">Still learning</button>
      <button class="known" id="known">Know it</button>
    </div>
    <button id="next">Next →</button>
  </div>
  <div class="bar"><i class="k" id="bar-k"></i><i class="l" id="bar-l"></i></div>
  <div class="tally"><span id="t-left"></span><span id="t-right"></span></div>
</section>

<!-- QUIZ -->
<section id="view-quiz" class="quiz hidden">
  <div class="prompt"><span class="tag" id="q-tag"></span><span id="q-def"></span></div>
  <div class="opts" id="q-opts"></div>
  <div class="verdict" id="q-verdict"></div>
  <div class="nav"><button id="q-next">Next question →</button><span id="q-score" style="font-size:12.5px;color:var(--bone-dim)"></span></div>
</section>

<!-- LIST -->
<section id="view-list" class="list hidden"><dl id="list-body"></dl></section>

<div class="empty hidden" id="empty">
  Nothing in this pile yet.
  <br><button id="empty-reset">Show all cards</button>
</div>

</div>
<script>
const DECK = [
/* ============ UNIT 1 ============ */
{u:1,k:"Person",q:"Christopher Columbus",a:"Italian navigator sailing for Spain whose 1492 voyage re-established contact between the Eastern and Western Hemispheres, initiating European colonization of the Americas."},
{u:1,k:"Person",q:"Bartolomé de Las Casas",a:"Spanish Dominican friar and former slaveholder who became a vocal defender of Indigenous rights, authoring critiques of the Encomienda system."},
{u:1,k:"Person",q:"Juan Ginés de Sepúlveda",a:"Spanish philosopher who defended Spanish conquest in the Valladolid Debate, arguing that Native Americans were “natural slaves.”"},
{u:1,k:"Term",q:"Columbian Exchange",a:"The vast transatlantic transfer of plants, animals, culture, people, technology, and disease between the Americas, Europe, and Africa after 1492. New World crops fueled European population growth; European diseases devastated Indigenous populations, spurring the transatlantic slave trade."},
{u:1,k:"Term",q:"Gold, God, and Glory",a:"The three primary motivations for European exploration — economic wealth, religious conversion, and national prestige."},
{u:1,k:"Term",q:"Encomienda System",a:"Spanish labor system granting conquerors land and control over Indigenous inhabitants. Conquerors were supposed to protect and Christianize Natives in exchange for forced labor; in practice a brutal form of enslavement that decimated Native populations."},
{u:1,k:"Term",q:"Casta System",a:"Spanish colonial social hierarchy ranking people by racial “purity” and ancestry, created as Spanish colonists intermarried with Native and African populations."},
{u:1,k:"Event",q:"Pueblo Revolt of 1680",a:"Armed Native rebellion that expelled Spanish colonizers from New Mexico — prime evidence of Native Americans defending their autonomy by force."},
{u:1,k:"Event",q:"Valladolid Debate",a:"Spanish debate over the treatment of Indigenous peoples, pitting Las Casas (defending Native rights) against Sepúlveda (defending conquest)."},
{u:1,k:"Term",q:"Southwest — Pueblo",a:"Arid environment; developed complex irrigation systems, maize agriculture, and permanent adobe structures."},
{u:1,k:"Term",q:"Great Plains / Great Basin — Lakota, Comanche",a:"Arid grasslands; mobile, nomadic lifestyle centered on hunting bison, and highly adapted after the Spanish introduced horses."},
{u:1,k:"Term",q:"Eastern Woodlands — Iroquois, Algonquian",a:"Mixed agricultural and hunter-gatherer societies of the Northeast; permanent villages and slash-and-burn farming."},
{u:1,k:"Term",q:"Pacific Northwest — Chinook",a:"Abundant marine resources and dense forests; wooden longhouses and hierarchical settled societies."},
{u:1,k:"Big idea",q:"Causation: crops and disease",a:"The influx of New World crops (potatoes, maize) caused a European population boom, while Old World diseases (smallpox, influenza) caused demographic collapse in the Americas."},
{u:1,k:"Big idea",q:"Continuity and change: shift in labor source",a:"Native population decline plus moral outcry pushed the Spanish to change labor systems, transitioning from the Encomienda system to enslaved African labor."},
{u:1,k:"Big idea",q:"Comparison: Native vs. European systems",a:"Politics — diverse Native societies (egalitarian bands to confederacies and empires) vs. centralized European monarchies. Economy — communal land use and reciprocity vs. private property and mercantilism. Religion — predominantly animistic vs. strictly monotheistic."},
{u:1,k:"Big idea",q:"Native agency in European encounters",a:"Formed military alliances with competing European powers, adopted European technologies such as firearms and horses, practiced cultural syncretism, and staged armed rebellions."},
{u:1,k:"Big idea",q:"Effect of Spanish invasion on Africa",a:"As Indigenous labor collapsed, Europeans established the Trans-Atlantic Slave Trade, destabilizing African states and societies."},

/* ============ UNIT 2 ============ */
{u:2,k:"Term",q:"Cash Crops",a:"Crops produced primarily for commercial sale and export rather than subsistence — tobacco, rice, indigo."},
{u:2,k:"Term",q:"Staple Crops",a:"Crops forming the dominant part of a population's diet and regional economy — wheat, corn."},
{u:2,k:"Term",q:"Chesapeake Region",a:"Virginia and Maryland: tobacco agriculture, indentured servitude shifting to chattel slavery, high mortality rates, and dispersed plantation settlement."},
{u:2,k:"Person",q:"John Smith",a:"Established discipline in early Jamestown, imposing order that helped the struggling settlement survive."},
{u:2,k:"Person",q:"John Rolfe",a:"Introduced sweet West Indian tobacco to Virginia, creating the economic foundation of the Southern plantation system."},
{u:2,k:"Event",q:"Starving Time",a:"The harsh winter of 1609–1610 in Jamestown, when food shortages, disease, and conflict killed the majority of English settlers."},
{u:2,k:"Term",q:"House of Burgesses",a:"Established in Virginia in 1619 — the first representative legislative assembly in British North America."},
{u:2,k:"Term",q:"Indentured Servants",a:"Men and women who signed contracts to work without pay for a set number of years in exchange for transportation to America."},
{u:2,k:"Term",q:"Chattel Slavery",a:"A system of bondage in which an enslaved person is legally treated as personal property — bought, sold, and inherited permanently."},
{u:2,k:"Person",q:"William Penn",a:"Founded Pennsylvania on Quaker beliefs: religious freedom, pacifism, democratic governance, and fair dealings with Native Americans."},
{u:2,k:"Term",q:"Pilgrims / Separatists",a:"Puritans who broke entirely from the Church of England and established Plymouth Colony in 1620."},
{u:2,k:"Term",q:"Mayflower Compact",a:"Agreement signed by the Pilgrims in 1620 establishing majority rule in Plymouth Colony."},
{u:2,k:"Term",q:"Puritans",a:"English religious group seeking to “purify” the Church of England from within; established Massachusetts Bay Colony."},
{u:2,k:"Person",q:"John Winthrop",a:"Leader of Massachusetts Bay who called the colony a “City upon a Hill” — a beacon of Christian morality for the world to watch."},
{u:2,k:"Person",q:"Roger Williams",a:"Dissenter banished from Massachusetts who advocated separation of church and state; founded Rhode Island."},
{u:2,k:"Person",q:"Anne Hutchinson",a:"Dissenter banished from Massachusetts for challenging male ministerial authority."},
{u:2,k:"Event",q:"Salem Witch Trials",a:"A 1692 outbreak of mass hysteria in Salem, Massachusetts that ended in the execution of 20 people, reflecting deep social and religious anxieties."},
{u:2,k:"Term",q:"Jamestown",a:"Founded 1607 — the first permanent English settlement. Survived on tobacco, hosted the first House of Burgesses, and saw the first arrival of enslaved Africans in 1619."},
{u:2,k:"Event",q:"Bacon's Rebellion",a:"A 1676 armed uprising in Virginia led by Nathaniel Bacon against Governor William Berkeley over Native American attacks and the lack of representation for frontier farmers."},
{u:2,k:"Big idea",q:"Cause and effect: Bacon's Rebellion",a:"The rebellion caused wealthy planters to distrust white indentured servants, producing a rapid shift toward African chattel slavery."},
{u:2,k:"Big idea",q:"Drawing the Color Line (Howard Zinn)",a:"Zinn's thesis that racial slavery and anti-Black racism were deliberately created by wealthy colonial elites to prevent class solidarity between poor whites and enslaved Black people after events like Bacon's Rebellion."},
{u:2,k:"Term",q:"Slave Codes of 1705",a:"Virginia's strict legal codes stripping Black people of human rights while granting poor whites minor social privileges — evidence for Zinn's “color line” argument."},
{u:2,k:"Big idea",q:"Spanish colonization",a:"Direct crown control; focused on wealth (gold and silver) and religious conversion; intermarried with Native populations, producing the casta system."},
{u:2,k:"Big idea",q:"French colonization",a:"Settled modern Canada; focused on the fur trade; small populations; formed strong diplomatic and trade alliances with Native Americans."},
{u:2,k:"Big idea",q:"English colonization",a:"Settled the Atlantic coast; focused on agriculture and permanent family communities; pushed Indigenous peoples off their lands rather than integrating them."},
{u:2,k:"Big idea",q:"New England Colonies",a:"Rocky soil, short growing season, natural harbors, harsh winters. Settled for religious freedom and godly communities. Economy: shipbuilding, fishing, timber, subsistence farming, commerce. Tight-knit towns, high literacy, direct democracy in town meetings."},
{u:2,k:"Big idea",q:"Middle Colonies",a:"Fertile soil, navigable rivers, temperate climate. Settled for economic trade and religious refuge (Quakers). Economy: wheat and grain — the “Breadbasket.” Highly diverse, religiously tolerant, with representative assemblies."},
{u:2,k:"Big idea",q:"Chesapeake / Southern Colonies",a:"Fertile coastal plains, long growing seasons, warm and humid. Settled for economic profit through cash crops. Economy: plantation agriculture (tobacco, rice, indigo) reliant on slave labor. Highly stratified society dominated by wealthy planters."},

/* ============ UNIT 3 ============ */
{u:3,k:"Term",q:"Navigation Acts",a:"Mercantilist laws requiring colonial trade to travel exclusively on British ships and route through British ports."},
{u:3,k:"Term",q:"Mercantilism",a:"Economic doctrine asserting that colonies exist solely to enrich the mother country."},
{u:3,k:"Term",q:"Salutary Neglect",a:"Unofficial British policy of relaxing enforcement of mercantilist trade laws so long as the colonies remained profitable."},
{u:3,k:"Event",q:"Great Awakening",a:"A major religious revival of the 1730s–1740s emphasizing personal salvation and emotional piety, and challenging established religious hierarchy."},
{u:3,k:"Person",q:"Jonathan Edwards & George Whitefield",a:"Leading preachers of the Great Awakening, whose emotional, personal style of revival preaching undercut traditional clerical authority."},
{u:3,k:"Term",q:"Virtual Representation",a:"British argument that Parliament represented all British subjects everywhere, whether or not they had voted for its members."},
{u:3,k:"Term",q:"Enlightenment",a:"18th-century intellectual movement emphasizing reason and liberty; the ideological cause of the American Revolution, giving colonists language to justify rebellion."},
{u:3,k:"Person",q:"John Locke",a:"Argued that governments derive legitimacy from protecting natural rights — life, liberty, and property — through a social contract. His influence appears directly in “Life, Liberty, and the pursuit of Happiness.”"},
{u:3,k:"Term",q:"Albany Plan of Union",a:"Benjamin Franklin's 1754 proposal for a unified colonial government for defense; rejected by both the colonies and Parliament."},
{u:3,k:"Term",q:"Proclamation of 1763",a:"British decree prohibiting colonial settlement west of the Appalachian Mountains."},
{u:3,k:"Term",q:"Stamp Act",a:"1765 British tax on internal colonial paper goods that ignited widespread protest over “no taxation without representation.”"},
{u:3,k:"Event",q:"Boston Massacre",a:"Clash between British soldiers and colonists that was seized on as propaganda against British military occupation."},
{u:3,k:"Event",q:"Boston Tea Party",a:"Direct action destroying British tea in Boston Harbor in protest of the Tea Act."},
{u:3,k:"Term",q:"Sons and Daughters of Liberty",a:"Colonial activist groups that organized boycotts against British goods; women in the Homespun Movement manufactured homemade textiles to replace boycotted British cloth."},
{u:3,k:"Term",q:"Committees of Correspondence",a:"Networks colonists used to coordinate political resistance and share information between colonies."},
{u:3,k:"Event",q:"French and Indian War (Seven Years' War)",a:"War between Britain and France for control of North America. Britain won but incurred massive debt. Its end in 1763 is a major turning point — the end of Salutary Neglect and the beginning of direct taxation."},
{u:3,k:"Term",q:"Common Sense",a:"Thomas Paine's 1776 pamphlet arguing for complete political independence, shifting colonial anger away from specific taxes and toward the monarchy itself."},
{u:3,k:"Term",q:"First and Second Continental Congress",a:"Governing bodies during the Revolution that organized boycotts, created the Continental Army, and drafted the Declaration of Independence."},
{u:3,k:"Term",q:"Declaration of Independence",a:"Drafted by Jefferson in 1776, announcing formal separation from Britain on the basis of Locke's natural rights and listing grievances against the King."},
{u:3,k:"Event",q:"Battle of Saratoga",a:"Victory that secured the French alliance, which supplied the naval, financial, and military support necessary for American victory."},
{u:3,k:"Term",q:"Treaty of Paris 1783",a:"Officially concluded the Revolutionary War, recognizing U.S. independence and setting generous western boundaries at the Mississippi River."},
{u:3,k:"Term",q:"Republican Motherhood",a:"Post-Revolutionary ideal assigning women the civic duty of raising virtuous, educated citizens for the new republic."},
{u:3,k:"Big idea",q:"Why salutary neglect worked for both sides",a:"The King saved money on enforcement while enjoying cheap raw materials and a market for British goods; the colonies enjoyed prosperity through smuggling and developed autonomous self-governing assemblies."},
{u:3,k:"Big idea",q:"Why Britain raised taxes, and how colonists reacted",a:"War debt from the French and Indian War caused Parliament to pass the Stamp and Townshend Acts. Colonists argued “no taxation without representation,” leading to non-importation boycotts, domestic manufacturing, and political coordination."},
{u:3,k:"Big idea",q:"Why the Patriots won",a:"Knowledge of local terrain, Washington's leadership and attrition strategy, and above all the French alliance secured after Saratoga."},
{u:3,k:"Big idea",q:"Global effects of the American Revolution",a:"At home it spurred democratic ideals, gradual abolition in northern states, and Republican Motherhood. Abroad it inspired anti-colonial movements including the French (1789) and Haitian (1791) Revolutions."},

/* ============ UNIT 4 ============ */
{u:4,k:"Term",q:"Precedent",a:"An earlier action or decision that serves as an example — such as Washington stepping down after two terms."},
{u:4,k:"Term",q:"10th Amendment",a:"Stipulates that powers not delegated to the federal government are reserved to the states or the people."},
{u:4,k:"Term",q:"Northwest Ordinance of 1787",a:"Established a process for admitting new states from the Northwest Territory, prohibited slavery in the region, and funded public education."},
{u:4,k:"Term",q:"Jefferson's Agrarian Vision",a:"America as a decentralized republic of independent, land-owning yeoman farmers, suspicious of industrialization."},
{u:4,k:"Term",q:"Proclamation of Neutrality",a:"Washington's 1793 declaration keeping the U.S. neutral in the war between France and Britain."},
{u:4,k:"Term",q:"Alien and Sedition Acts",a:"1798 Federalist laws targeting immigrants and criminalizing political criticism of the Adams administration."},
{u:4,k:"Term",q:"Articles of Confederation",a:"The first national constitution, creating an intentionally weak central government with no power to tax or regulate commerce — which led to economic chaos."},
{u:4,k:"Event",q:"Shays' Rebellion",a:"1786 armed uprising of debt-ridden farmers in Massachusetts. Because the Articles government was too weak to put it down, it triggered the calling of the Constitutional Convention."},
{u:4,k:"Term",q:"Federalists",a:"Favored a strong central government and ratification of the Constitution."},
{u:4,k:"Term",q:"Anti-Federalists",a:"Feared a strong national executive would destroy state sovereignty; demanded a Bill of Rights as the price of ratification."},
{u:4,k:"Term",q:"Bill of Rights",a:"The first ten amendments, drafted to satisfy Anti-Federalist demands by guaranteeing explicit protections for individual liberties."},
{u:4,k:"Term",q:"Hamilton's Financial Plan",a:"Strategy to stabilize national finances through federal assumption of state debts, a National Bank, and protective tariffs and excise taxes."},
{u:4,k:"Term",q:"National Bank",a:"Hamilton's central bank, justified through the elastic clause — key evidence of his loose-construction philosophy of implied powers."},
{u:4,k:"Event",q:"Whiskey Rebellion",a:"1794 uprising against Hamilton's whiskey tax. Washington mobilized 13,000 troops to crush it, proving that unlike under the Articles, the federal government could now enforce its laws."},
{u:4,k:"Term",q:"Washington's Farewell Address",a:"Warned against permanent foreign alliances and the destructive nature of domestic political parties."},
{u:4,k:"Term",q:"Kentucky and Virginia Resolutions",a:"Drafted by Jefferson and Madison, arguing that states could nullify unconstitutional federal laws such as the Alien and Sedition Acts."},
{u:4,k:"Event",q:"Election of 1800",a:"Jefferson defeated Adams — the first peaceful transfer of executive power between opposing political parties in modern history."},
{u:4,k:"Term",q:"Great Compromise",a:"Bridged large states (Virginia Plan) and small states (New Jersey Plan) by creating a bicameral legislature: the House by population, the Senate with equal representation."},
{u:4,k:"Term",q:"Virginia Plan",a:"Large-state proposal basing congressional representation on population."},
{u:4,k:"Term",q:"New Jersey Plan",a:"Small-state proposal giving each state equal representation in Congress."},
{u:4,k:"Term",q:"Three-Fifths Compromise",a:"Settled a North–South dispute by counting three of every five enslaved individuals for purposes of representation and taxation."},
{u:4,k:"Term",q:"Slave Trade Compromise",a:"Barred the federal government from banning the international slave trade for 20 years, until 1808."},
{u:4,k:"Big idea",q:"Loose vs. strict construction",a:"Hamilton read the Constitution loosely, using the elastic clause to justify the National Bank; Jefferson read it strictly, arguing the Bank was unconstitutional because it was not expressly authorized."},
{u:4,k:"Big idea",q:"Hamilton vs. Jefferson",a:"Vision — industrial and commercial superpower vs. agrarian republic. Federal power — strong central government vs. limited power and states' rights. Foreign policy — pro-British vs. pro-French."},

/* ============ UNIT 5 ============ */
{u:5,k:"Term",q:"Nationalism",a:"Devotion to one's nation, prioritizing national interests over regional concerns."},
{u:5,k:"Term",q:"Interchangeable Parts",a:"Factory innovation pioneered by Eli Whitney allowing rapid assembly and easy repair using identical, standardized components."},
{u:5,k:"Term",q:"Division of Labor",a:"Breaking production into specialized, repetitive tasks to increase efficiency."},
{u:5,k:"Term",q:"War Hawks",a:"Nationalist congressmen, including Henry Clay, who pushed for the War of 1812."},
{u:5,k:"Term",q:"Lowell Mill Girls",a:"Young New England farm women working in textile factories, who organized some of the earliest American labor strikes."},
{u:5,k:"Term",q:"Spoils System",a:"Jacksonian practice of rewarding political campaign supporters with federal government jobs."},
{u:5,k:"Event",q:"War of 1812",a:"Fought against Britain over impressment and frontier conflicts with Native nations. Fostered a surge in American nationalism and industrial self-sufficiency."},
{u:5,k:"Term",q:"Monroe Doctrine",a:"1823 policy declaring the Western Hemisphere closed to future European colonization."},
{u:5,k:"Term",q:"Market Revolution",a:"The transition from subsistence barter economies to a national, interconnected commercial market fueled by factory manufacturing and transportation."},
{u:5,k:"Big idea",q:"Causation: Transportation Revolution",a:"Canals, steamboats, and railroads caused the Market Revolution by drastically lowering freight costs and connecting Western farms to Northern factories."},
{u:5,k:"Term",q:"Erie Canal",a:"Completed 1825 — primary evidence of state-sponsored infrastructure creating a genuinely national market."},
{u:5,k:"Term",q:"American System",a:"Henry Clay's economic plan: protective tariffs, a Second National Bank, and federally funded internal improvements such as roads and canals."},
{u:5,k:"Event",q:"Election of 1828",a:"Jackson mobilized non-property-owning white voters, creating a party for the “common man” that opposed national banks and tariffs while promoting westward expansion."},
{u:5,k:"Person",q:"Andrew Jackson",a:"7th President. Expanded executive power through the veto, destroyed the National Bank, and enforced Native American removal."},
{u:5,k:"Term",q:"Indian Removal Act",a:"1830 legislation forcing southeastern tribes west of the Mississippi River."},
{u:5,k:"Event",q:"Trail of Tears",a:"The deadly forced march of the Cherokee Nation west of the Mississippi under the Indian Removal Act."},
{u:5,k:"Event",q:"Nullification Crisis",a:"1832 showdown in which South Carolina attempted to nullify federal tariffs; Jackson threatened military force until a compromise tariff was reached."},
{u:5,k:"Event",q:"Bank War",a:"Jackson vetoed the recharter of the Second National Bank as an elitist monopoly and moved federal funds into state “pet banks,” causing the Panic of 1837."},
{u:5,k:"Big idea",q:"Continuity and change in Jacksonian democracy",a:"A major change in expanding suffrage to all white men, but continuity in continuing to exclude women, Native Americans, and Black Americans from political life."},

/* ============ UNIT 6 ============ */
{u:6,k:"Term",q:"Border States",a:"Five slaveholding states — Missouri, Kentucky, Maryland, Delaware, and West Virginia — that remained loyal to the Union during the Civil War."},
{u:6,k:"Person",q:"Robert E. Lee",a:"Commander of the Confederate Army of Northern Virginia."},
{u:6,k:"Term",q:"Scalawag",a:"Derogatory term for Southern white unionists who supported Republican Reconstruction."},
{u:6,k:"Term",q:"Carpetbagger",a:"Derogatory term for Northerners who came south to support Republican Reconstruction."},
{u:6,k:"Term",q:"Anaconda Plan",a:"Union naval strategy to blockade Southern ports and seize control of the Mississippi River."},
{u:6,k:"Event",q:"Sherman's March to the Sea",a:"1864 total-war campaign destroying military targets and civilian infrastructure to break Southern morale."},
{u:6,k:"Term",q:"Radical Republicans",a:"Faction demanding harsh terms for readmitting Southern states and constitutional civil rights for freedpeople."},
{u:6,k:"Term",q:"Freedmen's Bureau",a:"Federal agency providing food, housing, legal assistance, and schools for newly freed Black Americans."},
{u:6,k:"Term",q:"Manifest Destiny",a:"Ideology asserting the United States was divinely ordained to expand from the Atlantic to the Pacific."},
{u:6,k:"Event",q:"Mexican-American War",a:"War through which the U.S. gained vast southwestern territories from Mexico in 1848 — and with them the political crisis of the 1850s over whether slavery would expand into the new lands."},
{u:6,k:"Event",q:"California Gold Rush",a:"The 1849 rush that populated California with extraordinary speed."},
{u:6,k:"Term",q:"Republican Party",a:"Founded in 1854 on a “Free Soil” platform dedicated to stopping the westward expansion of slavery."},
{u:6,k:"Event",q:"Dred Scott v. Sandford",a:"1857 Supreme Court ruling declaring that Black people were not citizens and that Congress could not constitutionally ban slavery in federal territories."},
{u:6,k:"Event",q:"Lincoln-Douglas Debates",a:"1858 debates that elevated Lincoln to national prominence over the issue of slavery's expansion."},
{u:6,k:"Event",q:"Fort Sumter",a:"1861 Confederate attack on a Union fort in South Carolina, marking the official start of the Civil War."},
{u:6,k:"Term",q:"Emancipation Proclamation",a:"1863 executive order declaring enslaved people in rebelling states legally free. A major turning point: it shifted the Union's war goal from preserving the Union to abolishing slavery, and allowed Black men to enlist."},
{u:6,k:"Term",q:"Gettysburg Address",a:"Lincoln's 1863 speech framing the war as a test of democratic self-government and a “new birth of freedom.”"},
{u:6,k:"Term",q:"13th Amendment",a:"Abolished slavery."},
{u:6,k:"Term",q:"14th Amendment",a:"Granted birthright citizenship and equal protection under the law."},
{u:6,k:"Term",q:"15th Amendment",a:"Protected voting rights for Black men."},
{u:6,k:"Big idea",q:"Significance of the Reconstruction Amendments",a:"The 13th, 14th, and 15th Amendments are the clearest evidence of the federal government expanding its power to mandate civil rights, permanently altering the original Constitution."}
];

const UNITS = {
 1:"Contact & Exploration",
 2:"Colonial America",
 3:"Road to Revolution",
 4:"Constitution & New Republic",
 5:"Market Revolution & Jackson",
 6:"Civil War & Reconstruction"
};

DECK.forEach((c,i)=>c.id=i);
const state={mode:"cards",unit:0,order:[],idx:0,flipped:false,
  status:{},starred:{},starredOnly:false,quiz:null,score:{right:0,total:0}};

const $=id=>document.getElementById(id);
document.getElementById('total').textContent=DECK.length;

/* ---------- deck building ---------- */
function pool(){
  return DECK.filter(c=>(state.unit===0||c.u===state.unit)&&(!state.starredOnly||state.starred[c.id]));
}
function rebuild(keepOrder){
  const p=pool();
  if(!keepOrder) state.order=p.map(c=>c.id);
  else state.order=state.order.filter(id=>p.some(c=>c.id===id));
  if(state.idx>=state.order.length) state.idx=0;
  render();
}
function current(){return DECK[state.order[state.idx]];}

/* ---------- unit rail ---------- */
const railData=[[0,"All units","1491–1877"]].concat(Object.keys(UNITS).map(u=>[+u,"Unit "+u,UNITS[u]]));
$('units').innerHTML=railData.map(([u,label,sub])=>
  `<button data-u="${u}" aria-pressed="${u===0}"><b>${label}</b><i>${sub}</i></button>`).join('');
$('units').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.unit=+b.dataset.u; state.idx=0; state.flipped=false;
  [...$('units').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  state.quiz=null; rebuild(false);
});

/* ---------- mode switching ---------- */
[['m-cards','cards'],['m-quiz','quiz'],['m-list','list']].forEach(([id,mode])=>{
  $(id).addEventListener('click',()=>{
    state.mode=mode; state.flipped=false;
    ['m-cards','m-quiz','m-list'].forEach(x=>$(x).setAttribute('aria-pressed',x===id));
    if(mode==='quiz'&&!state.quiz) newQuestion(); else render();
  });
});

/* ---------- flashcard controls ---------- */
$('card').addEventListener('click',()=>{state.flipped=!state.flipped;$('card').classList.toggle('flipped',state.flipped);});
$('next').addEventListener('click',()=>step(1));
$('prev').addEventListener('click',()=>step(-1));
$('known').addEventListener('click',()=>mark('known'));
$('learn').addEventListener('click',()=>mark('learn'));
$('shuffle').addEventListener('click',()=>{
  for(let i=state.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[state.order[i],state.order[j]]=[state.order[j],state.order[i]];}
  state.idx=0;state.flipped=false;render();
});
$('starred-only').addEventListener('click',()=>{
  state.starredOnly=!state.starredOnly;
  $('starred-only').textContent=state.starredOnly?"All cards":"Starred only";
  state.idx=0;rebuild(false);
});
$('reset').addEventListener('click',()=>{state.status={};state.score={right:0,total:0};render();});
$('empty-reset').addEventListener('click',()=>{
  state.starredOnly=false;$('starred-only').textContent="Starred only";state.unit=0;
  [...$('units').children].forEach((x,i)=>x.setAttribute('aria-pressed',i===0));
  state.idx=0;rebuild(false);
});
$('star').addEventListener('click',e=>{
  e.stopPropagation();const c=current();if(!c)return;
  state.starred[c.id]=!state.starred[c.id];render();
});
function step(d){
  if(!state.order.length)return;
  state.idx=(state.idx+d+state.order.length)%state.order.length;
  state.flipped=false;render();
}
function mark(s){
  const c=current();if(!c)return;
  state.status[c.id]=s;step(1);
}

/* ---------- quiz ---------- */
function newQuestion(){
  const p=pool();
  if(p.length<4){state.quiz=null;render();return;}
  const answer=p[Math.random()*p.length|0];
  const others=p.filter(c=>c.id!==answer.id).sort(()=>Math.random()-.5).slice(0,3);
  state.quiz={answer,opts:[answer,...others].sort(()=>Math.random()-.5),picked:null};
  render();
}
$('q-next').addEventListener('click',newQuestion);
function answerQuiz(id){
  if(state.quiz.picked!==null)return;
  state.quiz.picked=id;state.score.total++;
  if(id===state.quiz.answer.id)state.score.right++;
  render();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(state.mode!=='cards')return;
  if(e.target.tagName==='BUTTON'&&e.key===' '&&e.target.id!=='card')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();$('card').click();}
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='1')mark('learn');
  if(e.key==='2')mark('known');
});

/* ---------- render ---------- */
function render(){
  const p=pool();
  $('view-cards').classList.toggle('hidden',state.mode!=='cards');
  $('view-quiz').classList.toggle('hidden',state.mode!=='quiz');
  $('view-list').classList.toggle('hidden',state.mode!=='list');
  const isEmpty=p.length===0||(state.mode==='quiz'&&p.length<4);
  $('empty').classList.toggle('hidden',!isEmpty);
  if(isEmpty){
    ['view-cards','view-quiz','view-list'].forEach(v=>$(v).classList.add('hidden'));
    $('empty').firstChild.textContent=p.length===0?"Nothing in this pile yet. ":"A quiz needs at least four cards to choose from. ";
    $('position').textContent="0 cards";
    return;
  }

  if(state.mode==='cards'){
    const c=current();
    $('f-tag').textContent=`Unit ${c.u} · ${c.k}`;
    $('b-tag').textContent=`Unit ${c.u} · ${c.k} · ${c.q}`;
    $('f-term').textContent=c.q;
    $('b-def').textContent=c.a;
    $('card').classList.toggle('flipped',state.flipped);
    $('star').classList.toggle('on',!!state.starred[c.id]);
    $('position').textContent=`Card ${state.idx+1} of ${state.order.length}`;
    const k=Object.entries(state.status).filter(([id,s])=>s==='known'&&p.some(c=>c.id==id)).length;
    const l=Object.entries(state.status).filter(([id,s])=>s==='learn'&&p.some(c=>c.id==id)).length;
    $('bar-k').style.width=(k/p.length*100)+'%';
    $('bar-l').style.width=(l/p.length*100)+'%';
    $('t-left').innerHTML=`<b>${l}</b> still learning`;
    $('t-right').innerHTML=`<b>${k}</b> known`;
  }

  if(state.mode==='quiz'&&state.quiz){
    const {answer,opts,picked}=state.quiz;
    $('q-tag').textContent=`Unit ${answer.u} · which term is this?`;
    $('q-def').textContent=answer.a;
    $('q-opts').innerHTML=opts.map(o=>{
      let cls='';
      if(picked!==null){
        if(o.id===answer.id)cls='right';
        else if(o.id===picked)cls='wrong';
      }
      return `<button class="${cls}" data-id="${o.id}" ${picked!==null?'disabled':''}>${o.q}</button>`;
    }).join('');
    $('q-verdict').textContent=picked===null?'':
      (picked===answer.id?'Correct.':`Not quite — the answer is ${answer.q}.`);
    $('q-score').textContent=state.score.total?`${state.score.right} of ${state.score.total} correct`:'';
    $('position').textContent=`${p.length} cards in the pool`;
  }

  if(state.mode==='list'){
    let html='',lastU=null;
    p.forEach(c=>{
      if(c.u!==lastU){html+=`<div class="grp">Unit ${c.u} — ${UNITS[c.u]}</div>`;lastU=c.u;}
      html+=`<dt>${c.q}</dt><dd>${c.a}<em>${c.k}</em></dd>`;
    });
    $('list-body').innerHTML=html;
    $('position').textContent=`${p.length} cards`;
  }
}
$('q-opts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;answerQuiz(+b.dataset.id);
});

rebuild(false);
</script>
</body>
</html>
